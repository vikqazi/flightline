# Daily eBird waterfowl sightings for the map (data/<state>/sightings.json).
# Needs the EBIRD_API_KEY repository secret (Settings → Secrets and variables → Actions).
# Without it the job does nothing and stays green.
name: eBird sightings

on:
  schedule:
    - cron: '23 9 * * *'      # every day at 09:23 UTC — about 5 AM in New England
  workflow_dispatch:           # "Run workflow" button on the Actions tab

permissions:
  contents: write              # to commit the refreshed files

concurrency:
  group: sightings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Fetch recent waterfowl sightings from eBird
        id: fetch
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: node .github/sightings/fetch.js

      - name: Commit what changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*/sightings.json 2>/dev/null || true
          if git diff --cached --quiet; then echo 'Nothing new to commit.'; exit 0; fi
          git commit -m 'Update eBird sightings'
          git pull --rebase --quiet
          git push
