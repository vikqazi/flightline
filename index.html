<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Flightline: waterfowl hunting map for New Hampshire, Massachusetts, Maine and Rhode Island: 2026-27 zones, season dates and bag limits, water, boat ramps, refuge hunt units and closed areas.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A6%86%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Flightline Waterfowl Maps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ---- Flightline (formerly Granite Flyway) ---------------------------------
   Layout: a fixed command bar and zone strip over a full-bleed vector chart,
   with a left instrument rail and a right detail slip. Below 900px the rail
   and slip become overlays and the chart keeps the full width.            */
:root{
  --bg:#e4e9e7; --surface:#f6f9f8; --surface2:#ffffff; --sunk:#dae2df;
  --line:#c6d2ce; --line2:#a9b8b3;
  --fg:#16201e; --dim:#5b6b66;
  --accent:#8a6b14; --accent-ink:#fffdf5;
  --open:#1f6f4e; --closed:#a33a2b; --warn:#92650f; --info:#2d6183;
  --m-land:#d3dbd7; --m-nh:#e8ede9; --m-edge:#7d8d88; --m-water:#a9c8dd; --m-waterline:#6d9ab8;
  --m-marsh:#a2b68c; --m-marshline:#7d9468; --m-stream:#78a5c3;
  --m-public:#93b180; --m-publicline:#6d8e5b;
  --m-label:#273733; --m-halo:#ffffff;
  --m-access:#6b4ea8; --m-closed:#b5392a; --m-rules:#c47d0e; --m-spot:#1f6f4e; --m-sight:#0f8f8a;
  --shadow:0 1px 3px rgba(20,35,32,.10), 0 10px 30px rgba(20,35,32,.12);
  --f-disp:"Bitter",Georgia,"Times New Roman",serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --rail:308px; --railwide:430px; --slip:352px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0c1315; --surface:#141d20; --surface2:#1c272b; --sunk:#080e10;
  --line:#28363b; --line2:#3b4d53;
  --fg:#e7eeeb; --dim:#91a5a0;
  --accent:#d9b457; --accent-ink:#171203;
  --open:#4fb285; --closed:#e0705f; --warn:#dfa54c; --info:#6aa8cf;
  --m-land:#0e1517; --m-nh:#1b2628; --m-edge:#49605f; --m-water:#1b3a4e; --m-waterline:#3d7295;
  --m-marsh:#2b3f2d; --m-marshline:#53734a; --m-stream:#35688a;
  --m-public:#28422d; --m-publicline:#4c7152;
  --m-label:#cfdcd7; --m-halo:#0a1113;
  --m-access:#a98ae0; --m-closed:#e0705f; --m-rules:#eaa53a; --m-spot:#4fb285; --m-sight:#45d1c3;
  --shadow:0 1px 3px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1315; --surface:#141d20; --surface2:#1c272b; --sunk:#080e10;
  --line:#28363b; --line2:#3b4d53;
  --fg:#e7eeeb; --dim:#91a5a0;
  --accent:#d9b457; --accent-ink:#171203;
  --open:#4fb285; --closed:#e0705f; --warn:#dfa54c; --info:#6aa8cf;
  --m-land:#0e1517; --m-nh:#1b2628; --m-edge:#49605f; --m-water:#1b3a4e; --m-waterline:#3d7295;
  --m-marsh:#2b3f2d; --m-marshline:#53734a; --m-stream:#35688a;
  --m-public:#28422d; --m-publicline:#4c7152;
  --m-label:#cfdcd7; --m-halo:#0a1113;
  --m-access:#a98ae0; --m-closed:#e0705f; --m-rules:#eaa53a; --m-spot:#4fb285; --m-sight:#45d1c3;
  --shadow:0 1px 3px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---------- command bar ---------- */
.bar{display:flex;align-items:center;gap:14px;flex:0 0 auto;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  position:relative;z-index:60}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{width:26px;height:26px;flex:0 0 auto;color:var(--accent)}
.word{font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.statesw{display:flex;gap:0;border:1px solid var(--line2);border-radius:5px;overflow:hidden;flex:0 0 auto}
.statesw .sw{font-family:var(--f-data);font-size:11px;letter-spacing:.06em;padding:3px 8px;color:var(--dim);background:var(--surface2)}
.statesw .sw.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.statesw:hover{border-color:var(--accent)}
.spacer{flex:1 1 auto;min-width:0}
.datebox{display:flex;align-items:center;gap:0;background:var(--surface2);border:1px solid var(--line);
  border-radius:6px;overflow:hidden;flex:0 0 auto}
.datebox button{padding:6px 9px;color:var(--dim);font-size:15px;line-height:1}
.datebox button:hover{background:var(--sunk);color:var(--fg)}
.dface{position:relative;cursor:pointer;padding:4px 10px;border-left:1px solid var(--line);border-right:1px solid var(--line);
  min-width:150px;text-align:center}
.dface input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.dlabel{font-family:var(--f-data);font-size:12.5px;white-space:nowrap;pointer-events:none}
.calico{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--dim);pointer-events:none}
.dface:hover .calico{color:var(--accent)}
.dsub{font-size:10px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;pointer-events:none}
.today{padding:6px 11px !important;font-size:11.5px !important;letter-spacing:.05em;text-transform:uppercase;
  font-weight:600;color:var(--accent) !important}
.tabs{display:flex;gap:2px;flex:0 0 auto}
.tabs button{padding:7px 11px;border-radius:5px;font-size:12.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.tabs button:hover{background:var(--sunk);color:var(--fg)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{padding:7px;border-radius:5px;color:var(--dim);display:grid;place-items:center}
.iconbtn:hover{background:var(--sunk);color:var(--fg)}
.iconbtn svg{width:17px;height:17px;display:block}

/* ---------- zone strip ---------- */
.strip{display:flex;gap:1px;flex:0 0 auto;background:var(--line);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;z-index:50}
.strip::-webkit-scrollbar{display:none}
.zchip{flex:1 1 0;min-width:142px;background:var(--surface);padding:7px 11px;text-align:left;
  border-top:3px solid transparent;transition:background .12s}
.zchip:hover{background:var(--surface2)}
.zchip[aria-pressed="true"]{background:var(--surface2)}
.zchip .zn{font-family:var(--f-disp);font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.zsw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.zchip .zs{font-family:var(--f-data);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.zchip .zd{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-open{color:var(--open)} .is-closed{color:var(--closed)} .is-soon{color:var(--warn)}

/* ---------- body ---------- */
.body{flex:1 1 auto;display:flex;min-height:0;position:relative}
.rail{flex:0 0 var(--rail);width:var(--rail);transition:flex-basis .15s,width .15s;background:var(--surface);border-right:1px solid var(--line);
  overflow-y:auto;overscroll-behavior:contain;padding-bottom:28px}
.rail.wide{flex-basis:var(--railwide);width:var(--railwide)}
.mapwrap{flex:1 1 auto;position:relative;min-width:0;background:var(--m-land);z-index:0;isolation:isolate}
#map{position:absolute;inset:0;background:var(--m-land)}
.slip{flex:0 0 var(--slip);width:var(--slip);background:var(--surface);border-left:1px solid var(--line);
  overflow-y:auto;overscroll-behavior:contain;padding-bottom:28px}

/* ---------- panel furniture ---------- */
.railtabs{display:none}
@media (max-width:900px){
  .railtabs{display:flex;gap:2px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:3;
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:8px max(10px,env(safe-area-inset-left,0px)) 8px 10px}
  .railtabs button{padding:6px 10px;border-radius:5px;font-size:12.5px;font-weight:600;color:var(--dim)}
  .railtabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .railtabs .x{margin-left:auto;font-size:18px;line-height:1;padding:2px 6px;color:var(--dim)}
}
.psec{border-bottom:1px solid var(--line)}
.phead{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;text-align:left;
  font-family:var(--f-disp);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.phead:hover{color:var(--fg)}
.phead .chev{margin-left:auto;transition:transform .15s}
.phead[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.pbody{padding:0 14px 14px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
.val{font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}
.small{font-size:12px}
.tiny{font-size:11px}
hr.sep{border:0;border-top:1px solid var(--line);margin:11px 0}

.toggle{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:30px;height:17px;border-radius:9px;background:var(--line2);position:relative;
  flex:0 0 auto;transition:background .14s;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:var(--surface2);transition:transform .14s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(13px)}
.toggle .sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto}
.toggle span.t{font-size:13px}
.toggle .ct{margin-left:auto;font-family:var(--f-data);font-size:10.5px;color:var(--dim)}

.seg{display:flex;background:var(--sunk);border-radius:6px;padding:2px;gap:2px}
.seg button{flex:1 1 0;padding:5px 6px;border-radius:4px;font-size:11.5px;font-weight:600;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.fld{width:100%;padding:7px 9px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;
  font-size:13px;min-width:0}
textarea.fld{resize:vertical;min-height:62px;font-family:var(--f-body)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:5px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:12.5px}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--fg)}
.btn.ghost:hover{background:var(--sunk)}
.btn[disabled]{opacity:.5;cursor:default}

/* ---------- season timeline ---------- */
.tl{display:grid;grid-template-columns:62px 1fr;gap:4px 7px;align-items:center;margin-top:6px}
.tlname{font-size:11px;font-weight:600;color:var(--dim);text-align:right;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tltrack{position:relative;height:15px;background:var(--sunk);border-radius:3px;overflow:hidden}
.tlseg{position:absolute;top:0;bottom:0;background:var(--open);opacity:.85}
.tlnow{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent);z-index:3}
.tlaxis{position:relative;height:14px;font-family:var(--f-data);font-size:9px;color:var(--dim)}
.tlaxis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tlaxis span::before{content:"";position:absolute;left:50%;top:-4px;height:3px;width:1px;background:var(--line2)}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:6px;overflow:hidden}
.item{display:block;width:100%;text-align:left;background:var(--surface2);padding:8px 10px}
.item:hover{background:var(--sunk)}
.item .t1{font-size:13px;font-weight:600;line-height:1.25}
.item .t2{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-family:var(--f-data);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:1px 5px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

/* ---------- slip (detail) ---------- */
.sliphead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:11px 14px;display:flex;align-items:flex-start;gap:10px;z-index:2}
.sliphead h2{margin:0;font-family:var(--f-disp);font-size:16.5px;font-weight:700;line-height:1.2;text-wrap:balance}
.sliphead .sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--dim);white-space:nowrap}
.kv dd{margin:0;font-family:var(--f-data);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.note{background:var(--sunk);border-left:3px solid var(--line2);padding:8px 10px;border-radius:0 4px 4px 0;font-size:12.5px}
.note.alert{border-left-color:var(--closed);color:var(--fg)}
.note.good{border-left-color:var(--open)}
.note.rules{border-left-color:var(--warn)}

/* ---------- reference tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
table.wide{width:max-content;min-width:100%}
table.wide th,table.wide td{white-space:nowrap}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;
  background:var(--surface);position:sticky;top:0}
td.num{font-family:var(--f-data);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
a{color:var(--info)}
a:hover{text-decoration:underline}

/* ---------- map furniture ---------- */
.mapctl{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:10px;display:flex;
  flex-direction:column;gap:6px;z-index:500}
.mapctl button{width:32px;height:32px;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  color:var(--fg);display:grid;place-items:center;box-shadow:var(--shadow)}
.mapctl button:hover{background:var(--surface2)}
.mapctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mapctl svg{width:16px;height:16px;display:block}
.readout{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  z-index:500;display:flex;flex-direction:column;gap:5px;align-items:flex-start;pointer-events:none;max-width:min(62%,420px)}
.scalebar{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:2px 6px;
  font-family:var(--f-data);font-size:10px;box-shadow:var(--shadow)}
.scalebar i{display:block;height:3px;background:var(--fg);margin-top:2px}
.attrib{font-size:9.5px;color:var(--dim);background:var(--surface);border:1px solid var(--line);
  border-radius:4px;padding:2px 6px;box-shadow:var(--shadow)}
.geostat{position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:540;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 13px;
  font-size:12px;box-shadow:var(--shadow);max-width:min(78%,440px);line-height:1.35;text-align:center;border-radius:14px}
.geostat.bad{border-color:var(--closed);color:var(--closed)}
.crosshair{position:absolute;inset:0;pointer-events:none;z-index:400;display:none}
.crosshair.on{display:block}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:var(--accent);opacity:.85}
.crosshair::before{left:50%;top:calc(50% - 11px);width:1px;height:22px;transform:translateX(-50%)}
.crosshair::after{top:50%;left:calc(50% - 11px);height:1px;width:22px;transform:translateY(-50%)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--m-land);z-index:900;
  font-family:var(--f-data);font-size:12px;color:var(--dim);text-align:center;padding:20px}
.loading b{display:block;font-family:var(--f-disp);font-size:15px;color:var(--fg);margin-bottom:6px}
.leaflet-container{background:var(--m-land);font-family:var(--f-body)}
.leaflet-control-attribution{display:none}

.keycard{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:10px;z-index:520;
  width:230px;max-height:calc(100% - 96px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:9px 11px}
.keycard h3{margin:0;font-family:var(--f-disp);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);display:flex;align-items:center;gap:6px}
.keycard h3 button{margin-left:auto;color:var(--dim);font-size:16px;line-height:1;padding:0 3px}
.keycard h3 button:hover{color:var(--fg)}
.kgrp{margin-top:9px}
.kgrp>.lab{font-size:9.5px;margin-bottom:3px}
.krow{display:flex;align-items:flex-start;gap:7px;margin:3px 0;font-size:11.5px;line-height:1.32}
.ksw{width:17px;min-height:15px;flex:0 0 auto;display:grid;place-items:center;margin-top:1px}
.knote{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.35}
@media (max-width:900px){.keycard{max-height:calc(100% - 120px);width:206px}}
.searchcard{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:10px;z-index:560;
  width:min(370px,calc(100% - 64px));max-height:calc(100% - 96px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.searchcard[hidden]{display:none}
.mapwrap.searching .keycard{display:none}
.srow{display:flex;align-items:center;gap:7px;padding:5px 5px 5px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.srow svg{width:15px;height:15px;color:var(--dim);flex:0 0 auto}
.sfld{flex:1 1 auto;min-width:0;border:0;background:transparent;padding:6px 2px;font-size:14px;outline:none}
.sfld::-webkit-search-cancel-button{display:none}
.sx{color:var(--dim);font-size:19px;line-height:1;padding:3px 8px;border-radius:4px}
.sx:hover{background:var(--sunk);color:var(--fg)}
.sres{overflow-y:auto;overscroll-behavior:contain}
.sitem{display:grid;grid-template-columns:50px 1fr;column-gap:8px;width:100%;text-align:left;padding:7px 10px;
  border-bottom:1px solid var(--line)}
.sitem:last-child{border-bottom:0}
.sitem:hover,.sitem.hi{background:var(--sunk)}
.sitem .sk{grid-row:span 2;align-self:start;justify-self:start;margin-top:2px;font-family:var(--f-data);font-size:9px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);border-radius:3px;padding:1px 4px;white-space:nowrap}
.sitem .sn{font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- mobile ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,14,16,.5);z-index:70;display:none}
.scrim.on{display:block}
.mobtabs{display:none}

  .rail{position:absolute;left:0;top:0;bottom:0;z-index:80;box-shadow:var(--shadow);
    transform:translateX(-100%);transition:transform .2s;width:min(88vw,var(--rail))}
  .rail.on{transform:none}
  .rail.wide{flex-basis:auto;width:min(94vw,var(--railwide))}
  .slip{position:absolute;right:0;top:0;bottom:0;z-index:80;box-shadow:var(--shadow);width:min(92vw,var(--slip))}
  .tabs{display:none}
  .mobtabs{display:flex;gap:2px;flex:0 0 auto}
  .word{font-size:15px}
  .statesw .sw{padding:3px 7px}
  .zchip{min-width:124px}

@media (max-width:560px){
  .bar{gap:8px;flex-wrap:wrap;padding-block:7px}
